# Netlify builds the site from web/ (set "Base directory" to web). The Next.js runtime is detected automatically.
# Only NEXT_PUBLIC_* variables belong here (set them in the Netlify UI): NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_API_URL and NEXT_PUBLIC_SITE_URL.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
